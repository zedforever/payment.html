
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Payment Calculator</title>

    <script>
        function calculatePayment() {
            let PV = Number(document.getElementById("amount").value);
            let n = Number(document.getElementById("years").value);
            let r = Number(document.getElementById("rate").value);

            if (PV <= 0 || n <= 0 || r < 0 ||
                document.getElementById("amount").value === "" ||
                document.getElementById("years").value === "" ||
                document.getElementById("rate").value === "") {
                document.getElementById("result").innerHTML =
                    "Please enter a valid loan amount, number of years, and interest rate.";
                return;
            }

            let P;

            if (r === 0) {
                P = PV / (n * 12);
            } else {
                P = ((r / 100 / 12) * PV) /
                    (1 - (1 + (r / 100 / 12)) ** -(n * 12));
            }

            document.getElementById("result").innerHTML =
                "For a loan amount of $" + PV.toFixed(2) +
                overYears(n) +
                " and an annual interest rate of " + r +
                "%, your monthly loan payment will be $" +
                P.toFixed(2) + ".";
        }

        function overYears(n) {
            return ", over " + n + (n === 1 ? " year" : " years");
        }
    </script>
</head>

<body>
    <h1>Loan Payment Calculator</h1>

    <label for="amount">Present Value / Amount Requested ($):</label>
    <input type="number" id="amount" min="0.01" step="0.01"
           placeholder="Enter loan amount">
    <br><br>

    <label for="years">Loan Term (Years):</label>
    <input type="number" id="years" min="1" step="1"
           placeholder="Enter number of years">
    <br><br>

    <label for="rate">Annual Interest Rate (%):</label>
    <input type="number" id="rate" min="0" step="0.01"
           placeholder="Enter interest rate">
    <br><br>

    <button type="button" onclick="calculatePayment()">
        Calculate Payment
    </button>

    <h2>Result</h2>
    <p id="result">Enter your loan information and click Calculate Payment.</p>
</body>
</html>
